name: Swing Pipeline

on:
  schedule:
    # 出信号:UTC 零点后前一天的讨论量就完整了,要赶在美股开盘(13:30 UTC)前出。
    # GitHub 定时任务常延迟数小时,所以一天排 4 次,脚本按「讨论日」去重,只有第一次真正执行。
    - cron: '7 1,4,7,10 * * *'
    # 收盘后记账(同样可能延迟,记账可重复执行)
    - cron: '17 22 * * 1-5'
    - cron: '17 3 * * 2-6'
  workflow_dispatch:
    inputs:
      mode:
        description: 'signals | track | snapshot'
        required: false
        default: 'signals'

concurrency:
  group: swing-pipeline
  cancel-in-progress: false

jobs:
  swing:
    name: Social attention → swing signals
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write # keepalive
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      ADANOS_API_KEY: ${{ secrets.ADANOS_API_KEY }}
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - name: Run
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              "17 22 * * 1-5"|"17 3 * * 2-6") MODE=track ;;
              *) MODE=signals ;;
            esac
          fi
          python -m scripts.swing.run "$MODE"
      - uses: liskin/gh-workflow-keepalive@v1
        if: always()
