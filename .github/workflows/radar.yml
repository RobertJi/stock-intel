name: Sector Radar

on:
  schedule:
    # 半天级:01:15 UTC(北京 09:15,亚洲盘前)/ 13:15 UTC(北京 21:15,美股盘前)
    - cron: '15 1,13 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Pipeline stage (all/collect/triage/reason/score/alert/outcome)'
        required: false
        default: 'all'

concurrency:
  group: sector-radar
  cancel-in-progress: false

jobs:
  radar:
    name: Run Radar Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r scripts/requirements.txt
      - run: python -m scripts.radar.run ${{ github.event.inputs.mode || 'all' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
